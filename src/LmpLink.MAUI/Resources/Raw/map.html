<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naver Map</title>
    <script type="text/javascript" src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=a5r744p216"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    
    <script>
        // Global variables
        let map = null;
        let markers = {};
        let currentCircle = null;
        let highlightedMarker = null; // Currently highlighted marker
        let openInfoWindows = []; // Track all open info windows
        
        // Map styling settings (default values, can be overridden by applyMapSettings)
        let mapSettings = {
            userMarkerColor: '#60A5FA',
            assistantMarkerColor: '#FB923C',
            markerSize: 'Medium', // Small=12px, Medium=16px, Large=20px
            userBorderWidth: 2,
            assistantBorderWidth: 2,
            userShape: 'Circle', // Circle, Square, Diamond
            assistantShape: 'Square',
            highlightColor: '#FFFFFF',
            highlightBorderWidth: 3,
            highlightSizeMultiplier: 2.0,
            circleColor: '#60A5FA',
            circleOpacity: 0.3,
            circleBorderWidth: 2,
            uiScale: 1.0
        };
        
        // Auth failure handler
        window.navermap_authFailure = function() {
            alert('네이버 지도 인증 실패!\n\n콘솔에서 Web 서비스 URL 등록 확인:\n- file:///\n- http://localhost\n\n현재 URL: ' + window.location.href);
        };
        
        // Initialize map
        function initMap() {
            try {
                const dobongCenter = new naver.maps.LatLng(37.6688, 127.0471);
                
                const mapOptions = {
                    center: dobongCenter,
                    zoom: 14,
                    minZoom: 10,
                    maxZoom: 18,
                    mapTypeControl: true,
                    mapTypeControlOptions: {
                        style: naver.maps.MapTypeControlStyle.BUTTON,
                        position: naver.maps.Position.TOP_RIGHT
                    },
                    zoomControl: true,
                    zoomControlOptions: {
                        style: naver.maps.ZoomControlStyle.SMALL,
                        position: naver.maps.Position.TOP_LEFT
                    }
                };
                
                map = new naver.maps.Map('map', mapOptions);
                
                // Close all info windows when clicking on empty map area
                naver.maps.Event.addListener(map, 'click', function() {
                    closeAllInfoWindows();
                });
                
                console.log('Map initialized successfully');
                return true;
            } catch (error) {
                console.error('Map initialization failed:', error);
                alert('지도 초기화 실패: ' + error.message);
                return false;
            }
        }
        
        // Add single marker (C# calls with individual parameters)
        function addMarker(id, type, lat, lng, name, address) {
            try {
                if (!map) {
                    console.error('Map not initialized');
                    return false;
                }
                
                const position = new naver.maps.LatLng(lat, lng);
                const isUser = type === 'user';
                
                // Get size based on markerSize setting and uiScale
                const sizeMap = { 'Small': 12, 'Medium': 16, 'Large': 20 };
                const size = (sizeMap[mapSettings.markerSize] || 16) * mapSettings.uiScale;
                
                const color = isUser ? mapSettings.userMarkerColor : mapSettings.assistantMarkerColor;
                const borderWidth = isUser ? mapSettings.userBorderWidth : mapSettings.assistantBorderWidth;
                const shape = isUser ? mapSettings.userShape : mapSettings.assistantShape;
                
                const markerHtml = createMarkerHtml(color, size, borderWidth, shape, false);
                
                const marker = new naver.maps.Marker({
                    position: position,
                    map: map,
                    title: name,
                    icon: {
                        content: markerHtml,
                        anchor: new naver.maps.Point(size / 2, size / 2)
                    }
                });
                
                // Store marker metadata
                marker._personId = id;
                marker._personType = type;
                marker._personName = name;
                marker._personAddress = address;
                
                // Info window with same transparency as radius overlay (#B0000000 = 69% opacity)
                const tooltipScale = mapSettings.uiScale || 1.0;
                const infoWindow = new naver.maps.InfoWindow({
                    content: `<div style="
                        padding: ${12 * tooltipScale}px ${16 * tooltipScale}px;
                        min-width: ${160 * tooltipScale}px;
                        background: rgba(0, 0, 0, 0.69);
                        border-radius: ${8 * tooltipScale}px;
                        border: 1px solid rgba(255, 255, 255, 0.1);
                    ">
                        <h4 style="
                            margin: 0 0 ${6 * tooltipScale}px 0;
                            color: white;
                            font-size: ${15 * tooltipScale}px;
                            font-weight: bold;
                        ">${name}</h4>
                        <p style="
                            margin: 0;
                            font-size: ${13 * tooltipScale}px;
                            color: #DDDDDD;
                            line-height: 1.4;
                        ">${address || '주소 정보 없음'}</p>
                    </div>`,
                    borderWidth: 0,
                    backgroundColor: 'transparent',
                    anchorSize: new naver.maps.Size(0, 0),
                    pixelOffset: new naver.maps.Point(0, -10 * tooltipScale)
                });
                
                // Store info window reference
                marker._infoWindow = infoWindow;
                
                naver.maps.Event.addListener(marker, 'click', function(e) {
                    // Prevent map click event
                    e.domEvent.stopPropagation();
                    
                    if (infoWindow.getMap()) {
                        infoWindow.close();
                        removeFromOpenInfoWindows(infoWindow);
                    } else {
                        closeAllInfoWindows(); // Close all others first
                        infoWindow.open(map, marker);
                        openInfoWindows.push(infoWindow);
                    }
                });
                
                markers[id] = marker;
                console.log(`✅ Marker added: ${name} (${type}) at [${lat}, ${lng}]`);
                return true;
            } catch (error) {
                console.error('❌ Add marker failed:', error);
                return false;
            }
        }
        
        // Create marker HTML with shape support
        function createMarkerHtml(color, size, borderWidth, shape, isHighlight) {
            const borderColor = isHighlight ? mapSettings.highlightColor : 'white';
            const actualBorderWidth = isHighlight ? mapSettings.highlightBorderWidth : borderWidth;
            const shadowSize = isHighlight ? '20px' : '0';
            
            let shapeStyle = '';
            switch (shape) {
                case 'Circle':
                    shapeStyle = 'border-radius: 50%;';
                    break;
                case 'Square':
                    shapeStyle = 'border-radius: 3px;';
                    break;
                case 'Diamond':
                    shapeStyle = 'transform: rotate(45deg); border-radius: 3px;';
                    break;
                default:
                    shapeStyle = 'border-radius: 50%;';
            }
            
            const animation = isHighlight ? 'animation: bounce 0.6s ease-in-out;' : '';
            
            return `<div style="width:${size}px; height:${size}px; background:${color}; border:${actualBorderWidth}px solid ${borderColor}; ${shapeStyle} box-shadow:0 0 ${shadowSize} ${color}; transition:all 0.3s; ${animation}"></div>
                    ${isHighlight ? '<style>@keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }</style>' : ''}`;
        }
        
        // Add multiple markers
        function addMarkers(persons) {
            try {
                let count = 0;
                persons.forEach(person => {
                    if (addMarker(person)) count++;
                });
                console.log(`${count}/${persons.length} markers added`);
                return true;
            } catch (error) {
                console.error('Add markers failed:', error);
                return false;
            }
        }
        
        // Draw circle
        function drawCircle(lat, lng, radiusKm) {
            try {
                if (!map) return false;
                
                // Remove existing circle
                if (currentCircle) {
                    currentCircle.setMap(null);
                }
                
                const center = new naver.maps.LatLng(lat, lng);
                const radiusMeters = radiusKm * 1000;
                
                currentCircle = new naver.maps.Circle({
                    map: map,
                    center: center,
                    radius: radiusMeters,
                    fillColor: mapSettings.circleColor,
                    fillOpacity: mapSettings.circleOpacity,
                    strokeColor: mapSettings.circleColor,
                    strokeOpacity: 0.8,
                    strokeWeight: mapSettings.circleBorderWidth
                });
                
                console.log(`Circle drawn: ${radiusKm}km`);
                return true;
            } catch (error) {
                console.error('Draw circle failed:', error);
                return false;
            }
        }
        
        // Clear circle
        function clearCircle() {
            try {
                if (currentCircle) {
                    currentCircle.setMap(null);
                    currentCircle = null;
                    console.log('Circle cleared');
                }
                return true;
            } catch (error) {
                console.error('Clear circle failed:', error);
                return false;
            }
        }
        
        // Set marker visibility
        function setMarkerVisible(markerId, visible) {
            try {
                const marker = markers[markerId];
                if (marker) {
                    marker.setMap(visible ? map : null);
                    const action = visible ? '표시' : '숨김';
                    console.log(`Marker ${markerId} (${marker._personType}): ${action}`);
                    return true;
                }
                return false;
            } catch (error) {
                console.error('Set marker visibility failed:', error);
                return false;
            }
        }
        
        // Show all markers
        function showAllMarkers() {
            try {
                Object.values(markers).forEach(marker => {
                    marker.setMap(map);
                });
                console.log('All markers shown');
                return true;
            } catch (error) {
                console.error('Show all markers failed:', error);
                return false;
            }
        }
        
        // Set map center
        function setMapCenter(lat, lng) {
            try {
                if (!map) return false;
                const center = new naver.maps.LatLng(lat, lng);
                map.setCenter(center);
                console.log(`Map center set to: ${lat}, ${lng}`);
                return true;
            } catch (error) {
                console.error('Set map center failed:', error);
                return false;
            }
        }
        
        // Focus on marker with highlight (크기 확대, 색상 변경, 진동 애니메이션)
        function focusMarker(markerId) {
            try {
                const marker = markers[markerId];
                if (!marker) {
                    console.error(`Marker ${markerId} not found`);
                    return false;
                }
                
                // Get size based on markerSize setting
                const sizeMap = { 'Small': 12, 'Medium': 16, 'Large': 20 };
                const baseSize = (sizeMap[mapSettings.markerSize] || 16) * mapSettings.uiScale;
                
                // Reset previous highlighted marker
                if (highlightedMarker && highlightedMarker !== marker) {
                    const prevType = highlightedMarker._personType;
                    const prevIsUser = prevType === 'user';
                    const prevColor = prevIsUser ? mapSettings.userMarkerColor : mapSettings.assistantMarkerColor;
                    const prevBorderWidth = prevIsUser ? mapSettings.userBorderWidth : mapSettings.assistantBorderWidth;
                    const prevShape = prevIsUser ? mapSettings.userShape : mapSettings.assistantShape;
                    
                    const prevMarkerHtml = createMarkerHtml(prevColor, baseSize, prevBorderWidth, prevShape, false);
                    highlightedMarker.setIcon({
                        content: prevMarkerHtml,
                        anchor: new naver.maps.Point(baseSize / 2, baseSize / 2)
                    });
                }
                
                // Highlight current marker
                const isUser = marker._personType === 'user';
                const color = isUser ? mapSettings.userMarkerColor : mapSettings.assistantMarkerColor;
                const borderWidth = isUser ? mapSettings.userBorderWidth : mapSettings.assistantBorderWidth;
                const shape = isUser ? mapSettings.userShape : mapSettings.assistantShape;
                const highlightSize = Math.round(baseSize * mapSettings.highlightSizeMultiplier);
                
                const highlightHtml = createMarkerHtml(lightenColor(color, 20), highlightSize, borderWidth, shape, true);
                marker.setIcon({
                    content: highlightHtml,
                    anchor: new naver.maps.Point(highlightSize / 2, highlightSize / 2)
                });
                
                highlightedMarker = marker;
                
                // Move map center to marker
                map.setCenter(marker.getPosition());
                map.setZoom(15); // Zoom in
                
                // Open InfoWindow (close others first)
                const infoWindow = marker._infoWindow;
                if (infoWindow) {
                    closeAllInfoWindows();
                    infoWindow.open(map, marker);
                    openInfoWindows.push(infoWindow);
                }
                
                console.log(`✨ Focused on marker ${markerId} with highlight and InfoWindow`);
                return true;
            } catch (error) {
                console.error('Focus marker failed:', error);
                return false;
            }
        }
        
        // Close all info windows
        function closeAllInfoWindows() {
            openInfoWindows.forEach(infoWindow => {
                infoWindow.close();
            });
            openInfoWindows = [];
        }
        
        // Remove info window from tracking array
        function removeFromOpenInfoWindows(infoWindow) {
            const index = openInfoWindows.indexOf(infoWindow);
            if (index > -1) {
                openInfoWindows.splice(index, 1);
            }
        }
        
        // Get visible marker count (지도에 실제로 표시된 마커 개수)
        function getVisibleMarkerCount() {
            try {
                let userCount = 0;
                let assistantCount = 0;
                
                Object.values(markers).forEach(marker => {
                    if (marker.getMap()) { // 지도에 표시 중인 마커만
                        if (marker._personType === 'user') {
                            userCount++;
                        } else {
                            assistantCount++;
                        }
                    }
                });
                
                console.log(`Visible markers: 이용자 ${userCount}명, 지원사 ${assistantCount}명`);
                return JSON.stringify({ users: userCount, assistants: assistantCount });
            } catch (error) {
                console.error('Get visible marker count failed:', error);
                return JSON.stringify({ users: 0, assistants: 0 });
            }
        }
        
        // Apply map styling settings
        function applyMapSettings(userMarkerColor, assistantMarkerColor, markerSize, userBorderWidth, assistantBorderWidth, userShape, assistantShape, highlightColor, highlightBorderWidth, highlightSizeMultiplier, circleColor, circleOpacity, circleBorderWidth, uiScale) {
            try {
                console.log(`Applying map settings: User=${userMarkerColor}, Assistant=${assistantMarkerColor}, Size=${markerSize}, Circle=${circleColor}, Scale=${uiScale}`);
                
                // Update settings
                mapSettings.userMarkerColor = userMarkerColor;
                mapSettings.assistantMarkerColor = assistantMarkerColor;
                mapSettings.markerSize = markerSize;
                mapSettings.userBorderWidth = userBorderWidth;
                mapSettings.assistantBorderWidth = assistantBorderWidth;
                mapSettings.userShape = userShape;
                mapSettings.assistantShape = assistantShape;
                mapSettings.highlightColor = highlightColor;
                mapSettings.highlightBorderWidth = highlightBorderWidth;
                mapSettings.highlightSizeMultiplier = highlightSizeMultiplier;
                mapSettings.circleColor = circleColor;
                mapSettings.circleOpacity = circleOpacity;
                mapSettings.circleBorderWidth = circleBorderWidth;
                mapSettings.uiScale = uiScale || 1.0;
                
                // Get size based on markerSize setting
                const sizeMap = { 'Small': 12, 'Medium': 16, 'Large': 20 };
                const baseSize = (sizeMap[markerSize] || 16) * mapSettings.uiScale;
                
                // Redraw all markers with new settings
                Object.values(markers).forEach(marker => {
                    const isUser = marker._personType === 'user';
                    const isHighlighted = marker === highlightedMarker;
                    
                    const color = isUser ? userMarkerColor : assistantMarkerColor;
                    const borderWidth = isUser ? userBorderWidth : assistantBorderWidth;
                    const shape = isUser ? userShape : assistantShape;
                    
                    if (isHighlighted) {
                        // Highlighted marker (larger size)
                        const highlightSize = Math.round(baseSize * highlightSizeMultiplier);
                        const markerHtml = createMarkerHtml(lightenColor(color, 20), highlightSize, borderWidth, shape, true);
                        marker.setIcon({
                            content: markerHtml,
                            anchor: new naver.maps.Point(highlightSize / 2, highlightSize / 2)
                        });
                    } else {
                        // Normal marker
                        const markerHtml = createMarkerHtml(color, baseSize, borderWidth, shape, false);
                        marker.setIcon({
                            content: markerHtml,
                            anchor: new naver.maps.Point(baseSize / 2, baseSize / 2)
                        });
                    }
                });
                
                // Redraw circle with new style
                if (currentCircle) {
                    currentCircle.setOptions({
                        fillColor: circleColor,
                        fillOpacity: circleOpacity,
                        strokeColor: circleColor,
                        strokeWeight: circleBorderWidth
                    });
                }
                
                console.log('✅ Map settings applied successfully');
                return true;
            } catch (error) {
                console.error('❌ Apply map settings failed:', error);
                return false;
            }
        }
        
        // Helper: Lighten hex color by percentage
        function lightenColor(hex, percent) {
            // Remove # if present
            hex = hex.replace('#', '');
            
            // Convert to RGB
            let r = parseInt(hex.substring(0, 2), 16);
            let g = parseInt(hex.substring(2, 4), 16);
            let b = parseInt(hex.substring(4, 6), 16);
            
            // Lighten
            r = Math.min(255, Math.floor(r + (255 - r) * percent / 100));
            g = Math.min(255, Math.floor(g + (255 - g) * percent / 100));
            b = Math.min(255, Math.floor(b + (255 - b) * percent / 100));
            
            // Convert back to hex
            return '#' + 
                r.toString(16).padStart(2, '0') + 
                g.toString(16).padStart(2, '0') + 
                b.toString(16).padStart(2, '0');
        }
        
        // Initialize on page load
        window.addEventListener('load', function() {
            console.log('Page loaded, initializing map...');
            
            // Check if naver object is available
            if (typeof naver === 'undefined') {
                console.error('ERROR: Naver Maps API not loaded! Check API key.');
                return;
            }
            
            console.log('Naver Maps API loaded successfully! Initializing map...');
            const result = initMap();
            
            if (result) {
                console.log('Map initialized successfully!');
            } else {
                console.error('Map initialization failed!');
            }
        });
    </script>
</body>
</html>
